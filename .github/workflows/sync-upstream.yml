name: Sync fork with upstream

on:
  schedule:
    # GitHub cron is UTC. Hourly at :17 to avoid top-of-hour congestion.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream/master
        env:
          UPSTREAM_REPO: kingcharleslzy-ai/dsh-purge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "upstream/master is already contained in master; nothing to do."
            exit 0
          fi

          echo "Merging upstream/master into master..."
          git merge --no-edit upstream/master
          git push origin HEAD:master
